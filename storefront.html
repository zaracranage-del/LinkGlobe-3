<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">LinkGlobe Shop</title>
<meta name="description" id="pageDesc" content="Shop my picks">
<meta property="og:title" id="ogTitle" content="LinkGlobe Shop">
<meta property="og:description" id="ogDesc" content="Shop my favourite picks">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--ink:#1c1c1c;--gray:#64646a;--muted:#a0a0a8;
  --bg:#fff;--warm:#f7f6f3;--warm2:#f0ede6;--border:#e8e6e1;--border2:#d4d2cd;
  --green:#15803d;--red:#dc2626;
  --accent:var(--sf-accent,#0a0a0a);
}
html,body{font-family:'DM Sans',sans-serif;background:var(--warm);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{text-decoration:none;color:inherit}

/* ── HEADER ── */
.sf-header{background:var(--accent);padding:48px 24px 0;text-align:center;position:relative;overflow:hidden}
.sf-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,255,255,.08) 0%,transparent 70%);pointer-events:none}
.sf-inner{max-width:600px;margin:0 auto;position:relative;z-index:1}

.sf-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--accent);background:white;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.2)}
.sf-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}

.sf-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:white;margin-bottom:6px;letter-spacing:-.4px;line-height:1}
.sf-bio{font-size:13px;color:rgba(255,255,255,.5);line-height:1.65;max-width:320px;margin:0 auto 18px;font-weight:300}

.sf-socials{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sf-soc{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.65);padding:5px 13px;border-radius:50px;font-size:12px;transition:all .2s}
.sf-soc:hover{background:rgba(255,255,255,.15);color:white}

.sf-share-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:50px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:22px}
.sf-share-btn:hover{background:rgba(255,255,255,.13);color:rgba(255,255,255,.7)}

/* Collection tabs */
.sf-tabs{background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;white-space:nowrap;display:flex;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sf-tabs::-webkit-scrollbar{display:none}
.sf-tab{display:inline-flex;align-items:center;padding:12px 20px;font-size:13px;color:rgba(255,255,255,.45);border-bottom:2px solid transparent;font-weight:500;cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s;white-space:nowrap}
.sf-tab:hover{color:rgba(255,255,255,.8)}
.sf-tab.active{color:white;border-bottom-color:white}

/* ── MAIN ── */
.sf-main{max-width:1020px;margin:0 auto;padding:32px 20px 80px}

/* Section heading for collections */
.sf-section-head{margin-bottom:18px}
.sf-section-head h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--black);letter-spacing:-.3px}
.sf-section-head p{font-size:13px;color:var(--muted);margin-top:2px}

/* Product grid */
.sf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px}

/* Product card */
.sf-card{background:var(--bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:cardIn .3s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sf-card:nth-child(1){animation-delay:.03s}.sf-card:nth-child(2){animation-delay:.06s}.sf-card:nth-child(3){animation-delay:.09s}.sf-card:nth-child(4){animation-delay:.12s}.sf-card:nth-child(5){animation-delay:.15s}.sf-card:nth-child(6){animation-delay:.18s}.sf-card:nth-child(7){animation-delay:.21s}.sf-card:nth-child(8){animation-delay:.24s}
.sf-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.09)}

.sf-card-img{width:100%;aspect-ratio:1/1;background:var(--warm2);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;position:relative}
.sf-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.sf-card:hover .sf-card-img img{transform:scale(1.03)}

.sf-card-body{padding:12px 14px 14px}
.sf-card-store{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:5px;opacity:.85}
.sf-card-name{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:10px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.sf-social-proof{font-size:11px;color:#b45309;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:4px}

.sf-card-actions{display:flex;gap:6px}
.btn-shop{flex:1;display:block;background:var(--black);color:white;border:none;padding:8px 10px;border-radius:50px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;transition:opacity .15s;letter-spacing:.1px}
.btn-shop:hover{opacity:.8}
.btn-copy{background:none;border:1.5px solid var(--border);color:var(--muted);padding:8px 11px;border-radius:50px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-copy:hover{border-color:var(--black);color:var(--black)}

/* Empty / loading / not found */
.sf-empty{text-align:center;padding:72px 24px;color:var(--muted)}
.sf-empty-icon{font-size:44px;margin-bottom:14px}
.sf-empty h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sf-empty p{font-size:14px;line-height:1.6}
.sf-loading{text-align:center;padding:80px 24px;color:var(--muted);font-size:14px}
.sf-notfound{text-align:center;padding:100px 24px}
.sf-notfound h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;margin-bottom:10px}
.sf-notfound p{font-size:14px;color:var(--muted);margin-bottom:24px}

footer{text-align:center;padding:20px;border-top:1px solid var(--border)}
footer a{font-size:12px;color:var(--muted);transition:color .2s}
footer a:hover{color:var(--black)}

@media(max-width:600px){
  .sf-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .sf-card-img{aspect-ratio:4/3}
  .sf-main{padding:22px 12px 60px}
  .sf-name{font-size:26px}
}
</style>

<body>
<div id="app"><div class="sf-loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL      = 'https://lyknsmgvqrxuhxwryzws.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a25zbWd2cXJ4dWh4d3J5endzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzA4ODksImV4cCI6MjA5Mzc0Njg4OX0.o1DVN9fEb7qfIi0Kw7zGFUpPuluaUvllGIXEY3wHTW4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const handle = new URLSearchParams(window.location.search).get('handle')
             || window.location.pathname.replace(/^\/|\.html$/g, '') || '';

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(async function load(){
  if(!handle){ renderNotFound(''); return; }

  const collectionSlug = new URLSearchParams(window.location.search).get('c');

  const [
    {data:profile,error:profileErr},
    {data:allProducts},
    {data:clickRows},
    {data:allCollections}
  ] = await Promise.all([
    sb.from('signups').select('name,bio,instagram,tiktok,handle,plan,brand_color,custom_domain,avatar_url').eq('handle',handle).single(),
    sb.from('products').select('*').eq('handle',handle).order('created_at',{ascending:false}),
    sb.from('clicks').select('product_id').eq('handle',handle),
    sb.from('collections').select('*,collection_products(product_id)').eq('handle',handle).order('created_at',{ascending:true})
  ]);

  if(profileErr || !profile){ renderNotFound(handle); return; }

  const clickCounts = {};
  (clickRows||[]).forEach(r=>{ if(r.product_id) clickCounts[r.product_id]=(clickCounts[r.product_id]||0)+1; });

  let products = allProducts || [];
  let activeCollection = null;
  if(collectionSlug){
    const {data:coll} = await sb.from('collections')
      .select('*,collection_products(product_id)')
      .eq('handle',handle).eq('slug',collectionSlug).single();
    if(coll){
      activeCollection = coll;
      const ids = coll.collection_products.map(cp=>cp.product_id);
      products = products.filter(p=>ids.includes(p.id));
    }
  }

  render(profile, products, activeCollection, clickCounts, allCollections||[], (allProducts||[]).length);
})();

function render(p, products, collection, clickCounts, allCollections, totalProducts){
  clickCounts = clickCounts||{};
  const initials = (p.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const storeUrl = window.location.href.split('?')[0];
  const brandColor = p.brand_color || '#0a0a0a';
  document.documentElement.style.setProperty('--sf-accent', brandColor);

  document.getElementById('pageTitle').textContent = (p.name||'Creator')+"'s Picks – LinkGlobe";
  document.getElementById('ogTitle').setAttribute('content',(p.name||'Creator')+"'s Picks");

  const avatarHtml = p.avatar_url
    ? `<img src="${esc(p.avatar_url)}" alt="${esc(p.name)}">`
    : esc(initials);

  const socials = [
    p.instagram ? `<a class="sf-soc" href="https://instagram.com/${esc(p.instagram)}" target="_blank">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
      @${esc(p.instagram)}</a>` : '',
    p.tiktok ? `<a class="sf-soc" href="https://tiktok.com/@${esc(p.tiktok)}" target="_blank">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.16 8.16 0 004.77 1.52V6.78a4.85 4.85 0 01-1-.09z"/></svg>
      @${esc(p.tiktok)}</a>` : ''
  ].filter(Boolean).join('');

  const tabs = `
    <div class="sf-tabs">
      <div class="sf-tab ${!collection?'active':''}" onclick="navTo('${storeUrl}')">All (${totalProducts})</div>
      ${allCollections.map(c=>{
        const cnt = c.collection_products ? c.collection_products.length : 0;
        const active = collection && collection.id===c.id;
        return `<div class="sf-tab ${active?'active':''}" onclick="navTo('${storeUrl}?c=${esc(c.slug)}')">${esc(c.name)} (${cnt})</div>`;
      }).join('')}
    </div>`;

  const sectionHead = collection
    ? `<div class="sf-section-head"><h2>${esc(collection.name)}</h2>${collection.description?`<p>${esc(collection.description)}</p>`:''}</div>`
    : '';

  const cards = products.length===0
    ? `<div class="sf-empty"><div class="sf-empty-icon">🛍️</div><h3>Coming soon</h3><p>Products are being added — check back soon.</p></div>`
    : `<div class="sf-grid">${products.map(prod=>{
        const clicks = clickCounts[prod.id]||0;
        const fansLabel = clicks>=1000?(clicks/1000).toFixed(1)+'k':clicks;
        const proof = clicks>=5 ? `<div class="sf-social-proof"><svg width="11" height="11" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>${fansLabel} fans clicked</div>` : '';
        const imgHtml = prod.image
          ? `<img src="${esc(prod.image)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span style=font-size:48px>${prod.emoji||'🛍️'}</span>'">`
          : `<span>${prod.emoji||'🛍️'}</span>`;
        return `
        <div class="sf-card">
          <div class="sf-card-img">${imgHtml}</div>
          <div class="sf-card-body">
            <div class="sf-card-store">${esc(prod.store_label||prod.store||'')}</div>
            <div class="sf-card-name">${esc(prod.name)}</div>
            ${proof}
            <div class="sf-card-actions">
              <a class="btn-shop" href="${esc(prod.geo_link)}" target="_blank" onclick="trackClick(${prod.id},'${esc(prod.store)}','${esc(prod.geo_link)}');return true;">Shop now →</a>
              <button class="btn-copy" onclick="copyProd('${esc(prod.geo_link)}',this)">Copy</button>
            </div>
          </div>
        </div>`;
      }).join('')}</div>`;

  const footer = p.plan==='pro'
    ? `<footer></footer>`
    : `<footer><a href="https://linkglobe.co">🌏 Powered by LinkGlobe</a></footer>`;

  document.getElementById('app').innerHTML = `
    <header class="sf-header">
      <div class="sf-inner">
        <div class="sf-avatar">${avatarHtml}</div>
        <h1 class="sf-name">${esc(p.name)}'s Picks</h1>
        ${p.bio?`<p class="sf-bio">${esc(p.bio)}</p>`:''}
        ${socials?`<div class="sf-socials">${socials}</div>`:''}
        <button class="sf-share-btn" onclick="shareStore('${esc(storeUrl)}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share
        </button>
      </div>
      ${tabs}

}

function navTo(url){ window.location.href = url; }

function renderNotFound(h){
  document.getElementById('app').innerHTML = `
    <div class="sf-notfound">
      <div style="font-size:48px;margin-bottom:16px">🌏</div>
      <h1>Store not found</h1>
      <p>${h?`<strong>@${esc(h)}</strong> hasn't set up their store yet.`:'No store handle provided.'}</p>
      <a href="/onboarding.html" style="display:inline-block;background:var(--black);color:white;padding:12px 28px;border-radius:50px;font-size:14px;font-weight:500;margin-top:16px">Create your store →</a>
    </div>
    <footer><a href="https://linkglobe.co">🌏 Powered by LinkGlobe</a></footer>`;
}

function parseUA(){
  const ua=navigator.userAgent;
  return {
    device:/Mobi|Android/i.test(ua)?'Mobile':/Tablet|iPad/i.test(ua)?'Tablet':'Desktop',
    os:/iPhone|iPad|iPod/i.test(ua)?'iOS':/Android/i.test(ua)?'Android':/Windows/i.test(ua)?'Windows':/Mac/i.test(ua)?'macOS':'Other',
    browser:/Edg\//i.test(ua)?'Edge':/OPR\//i.test(ua)?'Opera':/Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':/Firefox/i.test(ua)?'Firefox':'Other'
  };
}
function getReferrer(){
  const ref=document.referrer;
  if(!ref) return 'Direct';
  try{
    const h=new URL(ref).hostname.replace('www.','');
    if(h.includes('instagram')) return 'Instagram';
    if(h.includes('tiktok'))    return 'TikTok';
    if(h.includes('youtube'))   return 'YouTube';
    if(h.includes('twitter')||h.includes('x.com')) return 'X / Twitter';
    if(h.includes('facebook'))  return 'Facebook';
    if(h.includes('pinterest')) return 'Pinterest';
    if(h.includes('google'))    return 'Google';
    return h;
  } catch{ return 'Direct'; }
}
async function trackClick(productId,store,geoLink){
  try{
    const {device,os,browser}=parseUA();
    let country='Unknown';
    try{ const g=await fetch('https://api.country.is/',{signal:AbortSignal.timeout(3000)}); if(g.ok){const d=await g.json();country=d.country||'Unknown';} }catch{}
    await sb.from('clicks').insert({handle,product_id:productId,store,country,referrer:getReferrer(),device_type:device,os,browser});
  }catch{}
}
function copyProd(url,btn){
  navigator.clipboard.writeText(url).then(()=>{
    const orig=btn.textContent;
    btn.textContent='Copied!';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2000);
  });
}
function shareStore(url){
  if(navigator.share) navigator.share({title:"My LinkGlobe store",url});
  else navigator.clipboard.writeText(url).then(()=>alert('Link copied!'));
}
