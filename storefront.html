<meta property="og:description" id="ogDesc" content="Shop my favourite picks">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--ink:#1c1c1c;--gray:#64646a;--muted:#a0a0a8;
  --bg:#fff;--warm:#f7f6f3;--warm2:#f0ede6;--border:#e8e6e1;--border2:#d4d2cd;
  --green:#15803d;--red:#dc2626;
  --accent:var(--sf-accent,#0a0a0a);
}
html,body{font-family:'DM Sans',sans-serif;background:var(--warm);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{text-decoration:none;color:inherit}

/* ── HEADER ── */
.sf-header{background:var(--accent);padding:56px 24px 0;text-align:center;position:relative;overflow:hidden}
.sf-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,255,255,.06) 0%,transparent 70%);pointer-events:none}
.sf-inner{max-width:600px;margin:0 auto;position:relative;z-index:1}

.sf-avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--accent);background:white;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 12px 32px rgba(0,0,0,.28)}
.sf-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}

.sf-name{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--sf-font-color,white);margin-bottom:8px;letter-spacing:-.3px;line-height:1;text-shadow:0 1px 12px rgba(0,0,0,.2)}
.sf-bio{font-size:13px;color:var(--sf-font-color,rgba(255,255,255,.5));opacity:.6;line-height:1.7;max-width:300px;margin:0 auto 20px;font-weight:300;letter-spacing:.1px}

.sf-socials{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sf-soc{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.65);padding:5px 13px;border-radius:50px;font-size:12px;transition:all .2s}
.sf-soc:hover{background:rgba(255,255,255,.15);color:white}

.sf-share-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:50px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:22px}
.sf-share-btn:hover{background:rgba(255,255,255,.13);color:rgba(255,255,255,.7)}

/* Collection tabs */
.sf-tabs{background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;white-space:nowrap;display:flex;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sf-tabs::-webkit-scrollbar{display:none}
.sf-tab{display:inline-flex;align-items:center;padding:12px 20px;font-size:13px;color:rgba(255,255,255,.45);border-bottom:2px solid transparent;font-weight:500;cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s;white-space:nowrap}
.sf-tab:hover{color:rgba(255,255,255,.8)}
.sf-tab.active{color:white;border-bottom-color:white}

/* ── MAIN ── */
.sf-main{max-width:1020px;margin:0 auto;padding:32px 20px 80px}

/* Section heading for collections */
.sf-section-head{margin-bottom:18px}
.sf-section-head h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--black);letter-spacing:-.3px}
.sf-section-head p{font-size:13px;color:var(--muted);margin-top:2px}

/* Product grid */
.sf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px}

/* Product card */
.sf-card{background:var(--bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:cardIn .35s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sf-card:nth-child(1){animation-delay:.04s}.sf-card:nth-child(2){animation-delay:.08s}.sf-card:nth-child(3){animation-delay:.12s}.sf-card:nth-child(4){animation-delay:.16s}.sf-card:nth-child(5){animation-delay:.20s}.sf-card:nth-child(6){animation-delay:.24s}.sf-card:nth-child(7){animation-delay:.28s}.sf-card:nth-child(8){animation-delay:.32s}
.sf-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.11)}

.sf-card-img{width:100%;aspect-ratio:4/5;background:var(--warm2);display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;position:relative}
.sf-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.sf-card:hover .sf-card-img img{transform:scale(1.05)}

.sf-card-body{padding:14px 16px 16px}
.sf-card-store{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:5px}
.sf-card-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;line-height:1.35;margin-bottom:12px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.1px}

.sf-social-proof{font-size:11px;color:#b45309;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:4px}

.sf-card-actions{display:flex;gap:6px}
.btn-shop{flex:1;display:block;background:var(--sf-btn-color,var(--black));color:white;border:1.5px solid var(--sf-btn-color,var(--black));padding:9px 10px;border-radius:50px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;transition:opacity .15s;letter-spacing:.3px;text-transform:uppercase}
.btn-shop:hover{opacity:.75}
[data-btn="outline"] .btn-shop{background:transparent;color:var(--sf-btn-color,var(--black))}
.btn-copy{background:none;border:1.5px solid var(--border);color:var(--muted);padding:9px 12px;border-radius:50px;font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-copy:hover{border-color:var(--black);color:var(--black)}

/* Empty / loading / not found */
.sf-empty{text-align:center;padding:72px 24px;color:var(--muted)}
.sf-empty-icon{font-size:44px;margin-bottom:14px}
.sf-empty h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sf-empty p{font-size:14px;line-height:1.6}
.sf-loading{text-align:center;padding:80px 24px;color:var(--muted);font-size:14px}
.sf-notfound{text-align:center;padding:100px 24px}
.sf-notfound h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;margin-bottom:10px}
.sf-notfound p{font-size:14px;color:var(--muted);margin-bottom:24px}

/* ── THEMES ── */
[data-theme="noir"]    .sf-header{background:#0a0a0a}
[data-theme="slate"]   .sf-header{background:linear-gradient(160deg,#0a0015,#160029)}
[data-theme="plum"]    .sf-header{background:linear-gradient(160deg,#3d0f20,#773344)}
[data-theme="blush"]   .sf-header{background:linear-gradient(160deg,#5c1030,#8D2645)}
[data-theme="terra"]   .sf-header{background:linear-gradient(160deg,#250f08,#513229)}
[data-theme="caramel"] .sf-header{background:linear-gradient(160deg,#1c1012,#554345)}
[data-theme="sage"]    .sf-header{background:linear-gradient(160deg,#0e2828,#1a4545)}
[data-theme="ivory"]   .sf-header{background:#F4F1E2}
[data-theme="ivory"]   .sf-name{color:#1c1c1c}
[data-theme="ivory"]   .sf-bio{color:rgba(0,0,0,.5)}
[data-theme="ivory"]   .sf-avatar{color:#1c1c1c}
[data-theme="ivory"]   .sf-soc{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.6)}
[data-theme="ivory"]   .sf-share-btn{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1);color:rgba(0,0,0,.5)}
[data-theme="ivory"]   .sf-tab{color:rgba(0,0,0,.4)}
[data-theme="ivory"]   .sf-tab.active{color:#1c1c1c;border-bottom-color:#1c1c1c}
[data-theme="ivory"]   .sf-tabs{background:rgba(0,0,0,.06)}
/* Font colour */
[data-font-color] .sf-name{color:var(--sf-font-color,white)}
/* Background image — full bleed, no overlay */
[data-bg-image="true"] .sf-header{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
[data-bg-image="true"] .sf-inner{position:relative;z-index:2}
[data-bg-image="true"] .sf-tabs{position:relative;z-index:2}

/* ── FONTS ── */
[data-font="sans"]  .sf-name{font-family:'DM Sans',sans-serif;letter-spacing:-.5px}
[data-font="mono"]  .sf-name{font-family:'Courier New',Courier,monospace;letter-spacing:-.5px;font-weight:700}

/* ── BUTTON STYLES ── */
[data-btn="soft"]    .btn-shop{border-radius:12px}
[data-btn="soft"]    .btn-copy{border-radius:12px}
[data-btn="sharp"]   .btn-shop{border-radius:4px}
[data-btn="sharp"]   .btn-copy{border-radius:4px}
[data-btn="outline"] .btn-shop{background:transparent!important;color:var(--sf-btn-color,var(--black));border:1.5px solid var(--sf-btn-color,var(--black))}
[data-btn="outline"] .btn-shop:hover{opacity:1;background:var(--sf-btn-color,var(--black))!important;color:white}

footer{text-align:center;padding:20px;border-top:1px solid var(--border)}
footer a{font-size:12px;color:var(--muted);transition:color .2s}
footer a:hover{color:var(--black)}

@media(max-width:600px){
  .sf-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .sf-card-img{aspect-ratio:4/3}
  .sf-main{padding:22px 12px 60px}
  .sf-name{font-size:26px}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL      = 'https://lyknsmgvqrxuhxwryzws.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a25zbWd2cXJ4dWh4d3J5endzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzA4ODksImV4cCI6MjA5Mzc0Njg4OX0.o1DVN9fEb7qfIi0Kw7zGFUpPuluaUvllGIXEY3wHTW4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const handle = new URLSearchParams(window.location.search).get('handle')
             || window.location.pathname.replace(/^\/|\.html$/g, '') || '';

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function proxyImg(el, emoji){
  if(!el._proxied){ el._proxied=true; var u=el.src; el.src='https://images.weserv.nl/?url='+encodeURIComponent(u); }
  else { el.parentElement.innerHTML='<span style="font-size:48px">'+(emoji||'🛍️')+'</span>'; }
}

(async function load(){
  if(!handle){ renderNotFound(''); return; }

  const collectionSlug = new URLSearchParams(window.location.search).get('c');

  // Fetch profile with select('*') so it works regardless of which columns exist
  const {data:profile, error:profileErr} = await sb.from('signups').select('*').eq('handle',handle).single();

  if(profileErr || !profile){
    console.error('LinkGlobe storefront: profile lookup failed', {handle, profileErr});
    renderNotFound(handle); return;
  }

  // Fetch other data in parallel (errors are soft — missing tables won't crash the storefront)
  const [{data:allProducts}, {data:clickRows}, {data:allCollections}] = await Promise.all([
    sb.from('products').select('*').eq('handle',handle).order('created_at',{ascending:false}),
    sb.from('clicks').select('product_id').eq('handle',handle),
    sb.from('collections').select('*').eq('handle',handle).order('created_at',{ascending:true})
      .then(async r => {
        if(!r.data) return r;
        // Attach product IDs for each collection
        const withProds = await Promise.all(r.data.map(async c => {
          const {data:cp} = await sb.from('collection_products').select('product_id').eq('collection_id',c.id);
          return {...c, collection_products: cp||[]};
        }));
        return {data: withProds};
      }).catch(()=>({data:[]}))
  ]);

  const clickCounts = {};
  (clickRows||[]).forEach(r=>{ if(r.product_id) clickCounts[r.product_id]=(clickCounts[r.product_id]||0)+1; });

  let products = allProducts || [];
  let activeCollection = null;
  if(collectionSlug){
    const {data:coll} = await sb.from('collections')
      .select('*,collection_products(product_id)')
      .eq('handle',handle).eq('slug',collectionSlug).single();
    if(coll){
      activeCollection = coll;
      const ids = coll.collection_products.map(cp=>cp.product_id);
      products = products.filter(p=>ids.includes(p.id));
    }
  }

  render(profile, products, activeCollection, clickCounts, allCollections||[], (allProducts||[]).length);
})();

function render(p, products, collection, clickCounts, allCollections, totalProducts){
  clickCounts = clickCounts||{};
  const initials = (p.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const storeUrl = window.location.href.split('?')[0];
  const brandColor = p.brand_color || '#0a0a0a';
  document.documentElement.style.setProperty('--sf-accent', brandColor);

  const theme     = p.sf_theme || 'noir';
  const font      = p.sf_font  || 'serif';
  const btn       = p.sf_btn_style || 'rounded';
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.font  = font;
  document.documentElement.dataset.btn   = btn;

  const btnColor  = p.sf_btn_color  || '#0a0a0a';
  const fontColor = p.sf_font_color || (theme === 'ivory' ? '#1c1c1c' : '#ffffff');
  document.documentElement.style.setProperty('--sf-btn-color',  btnColor);
  document.documentElement.style.setProperty('--sf-font-color', fontColor);
  // Custom solid background colour overrides theme
  const bgColor = p.sf_bg_color || '';
  if(bgColor){
    const header = document.querySelector('.sf-header');
    if(header) header.style.background = bgColor;
  }
  // Background image overrides everything
  const bgImage = p.sf_bg_image || '';
  if(bgImage){
    document.documentElement.dataset.bgImage = 'true';
    const header = document.querySelector('.sf-header');
    if(header) header.style.backgroundImage = `url(${bgImage})`;
  } else {
    document.documentElement.dataset.bgImage = 'false';
  }
  // og:url
  const ogUrl = document.querySelector('meta[property="og:url"]');
  if(ogUrl) ogUrl.setAttribute('content', window.location.href);

  document.getElementById('pageTitle').textContent = (p.name||'Creator')+"'s Picks – LinkGlobe";
  document.getElementById('ogTitle').setAttribute('content',(p.name||'Creator')+"'s Picks");

  const avatarHtml = p.avatar_url
    ? `<img src="${esc(p.avatar_url)}" alt="${esc(p.name)}">`
    : esc(initials);

  const socials = [
    p.instagram ? `<a class="sf-soc" href="https://instagram.com/${esc(p.instagram)}" target="_blank">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
      @${esc(p.instagram)}</a>` : '',
    p.tiktok ? `<a class="sf-soc" href="https://tiktok.com/@${esc(p.tiktok)}" target="_blank">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.16 8.16 0 004.77 1.52V6.78a4.85 4.85 0 01-1-.09z"/></svg>
      @${esc(p.tiktok)}</a>` : ''
  ].filter(Boolean).join('');

  const tabs = `
    <div class="sf-tabs">
      <div class="sf-tab ${!collection?'active':''}" onclick="navTo('${storeUrl}')">All (${totalProducts})</div>
      ${allCollections.map(c=>{
        const cnt = c.collection_products ? c.collection_products.length : 0;
        const active = collection && collection.id===c.id;
        return `<div class="sf-tab ${active?'active':''}" onclick="navTo('${storeUrl}?c=${esc(c.slug)}')">${esc(c.name)} (${cnt})</div>`;
      }).join('')}
    </div>`;

  const sectionHead = collection
    ? `<div class="sf-section-head"><h2>${esc(collection.name)}</h2>${collection.description?`<p>${esc(collection.description)}</p>`:''}</div>`
    : '';

  const cards = products.length===0
    ? `<div class="sf-empty"><div class="sf-empty-icon">🛍️</div><h3>Coming soon</h3><p>Products are being added — check back soon.</p></div>`
    : `<div class="sf-grid">${products.map(prod=>{
        const clicks = clickCounts[prod.id]||0;
        const fansLabel = clicks>=1000?(clicks/1000).toFixed(1)+'k':clicks;
        const proof = clicks>=5 ? `<div class="sf-social-proof"><svg width="11" height="11" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>${fansLabel} fans clicked</div>` : '';
        const imgHtml = prod.image
          ? `<img src="${esc(prod.image)}" alt="" loading="lazy" onerror="proxyImg(this,'${prod.emoji||'🛍️'}')">`
          : `<span>${prod.emoji||'🛍️'}</span>`;
        return `
        <div class="sf-card">
          <div class="sf-card-img">${imgHtml}</div>
          <div class="sf-card-body">
            <div class="sf-card-store">${esc(prod.store_label||prod.store||'')}</div>
            <div class="sf-card-name">${esc(prod.name)}</div>
            ${proof}
            <div class="sf-card-actions">
              <a class="btn-shop" href="${esc(prod.geo_link)}" target="_blank" onclick="trackClick(${prod.id},'${esc(prod.store)}','${esc(prod.geo_link)}');return true;">Shop now →</a>
              <button class="btn-copy" onclick="copyProd('${esc(prod.geo_link)}',this)">Copy</button>
            </div>
          </div>
        </div>`;
      }).join('')}</div>`;

  const footer = p.plan==='pro'
    ? `<footer></footer>`
    : `<footer><a href="/" target="_blank" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 12px;border:1px solid var(--border);border-radius:50px;transition:all .2s" onmouseover="this.style.color='var(--black)';this.style.borderColor='var(--black)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Powered by LinkGlobe</a></footer>`;

  document.getElementById('app').innerHTML = `
    <header class="sf-header">
      <div class="sf-inner">
        <div class="sf-avatar">${avatarHtml}</div>
        <h1 class="sf-name">${esc(p.name)}'s Picks</h1>
        ${p.bio?`<p class="sf-bio">${esc(p.bio)}</p>`:''}
        ${socials?`<div class="sf-socials">${socials}</div>`:''}
        <button class="sf-share-btn" onclick="shareStore('${esc(storeUrl)}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share
        </button>
      </div>
      ${tabs}
    </header>
    <main class="sf-main">${sectionHead}${cards}</main>
    ${footer}`;
}

function navTo(url){ window.location.href = url; }

function renderNotFound(h){
  document.getElementById('app').innerHTML = `
    <div class="sf-notfound">
      <div style="font-size:48px;margin-bottom:16px">🌏</div>
      <h1>${h?`@${esc(h)}`:'Store not found'}</h1>
      <p>${h?`This store isn't available right now.`:'No store handle provided.'}</p>
      <a href="/" style="display:inline-block;background:var(--black);color:white;padding:12px 28px;border-radius:50px;font-size:14px;font-weight:500;margin-top:16px">Go to LinkGlobe →</a>
    </div>
    <footer><a href="/" target="_blank" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 12px;border:1px solid var(--border);border-radius:50px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Powered by LinkGlobe</a></footer>`;
}

function parseUA(){
  const ua=navigator.userAgent;
  return {
    device:/Mobi|Android/i.test(ua)?'Mobile':/Tablet|iPad/i.test(ua)?'Tablet':'Desktop',
    os:/iPhone|iPad|iPod/i.test(ua)?'iOS':/Android/i.test(ua)?'Android':/Windows/i.test(ua)?'Windows':/Mac/i.test(ua)?'macOS':'Other',
    browser:/Edg\//i.test(ua)?'Edge':/OPR\//i.test(ua)?'Opera':/Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':/Firefox/i.test(ua)?'Firefox':'Other'
  };
}
function getReferrer(){
  const ref=document.referrer;
  if(!ref) return 'Direct';
  try{
    const h=new URL(ref).hostname.replace('www.','');
    if(h.includes('instagram')) return 'Instagram';
    if(h.includes('tiktok'))    return 'TikTok';
    if(h.includes('youtube'))   return 'YouTube';
    if(h.includes('twitter')||h.includes('x.com')) return 'X / Twitter';
    if(h.includes('facebook'))  return 'Facebook';
    if(h.includes('pinterest')) return 'Pinterest';
    if(h.includes('google'))    return 'Google';
    return h;
  } catch{ return 'Direct'; }
}
async function trackClick(productId,store,geoLink){
  try{
    const {device,os,browser}=parseUA();
    let country='Unknown';
    try{ const g=await fetch('https://api.country.is/',{signal:AbortSignal.timeout(3000)}); if(g.ok){const d=await g.json();country=d.country||'Unknown';} }catch{}
    await sb.from('clicks').insert({handle,product_id:productId,store,country,referrer:getReferrer(),device_type:device,os,browser});
  }catch{}
}
function copyProd(url,btn){
  navigator.clipboard.writeText(url).then(()=>{
    const orig=btn.textContent;
    btn.textContent='Copied!';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2000);
  });
}
function shareStore(url){
  if(navigator.share) navigator.share({title:"My LinkGlobe store",url});
  else navigator.clipboard.writeText(url).then(()=>alert('Link copied!'));
}
</script>
